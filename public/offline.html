<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prime PORTAL — Offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .tile { max-width: 420px; }
      .mark {
        width: 72px; height: 72px; margin: 0 auto 20px;
        border-radius: 18px; background: #fbbf24; position: relative;
        box-shadow: 0 10px 30px rgba(251,191,36,.25);
      }
      .mark::after {
        content: ''; position: absolute; inset: 16px 22px auto 26px; height: 40px;
        border: 8px solid #0f172a; border-bottom: none; border-right: none;
        border-top-right-radius: 20px;
      }
      h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #fbbf24; color: #0f172a; font-weight: 800; font-size: 13px;
        padding: 12px 22px; border-radius: 12px;
      }
      button:hover { filter: brightness(1.05); }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>
        The portal needs a connection to reach the ERP for live pricing,
        orders and official documents. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
